<div class="form-container">
    <form [formGroup]="pesquisaForm" class="form">
        <mat-form-field class="form-group">
            <mat-label for="produto">Produtos:</mat-label>
            <input matInput (input)="BuscaRelatorio()" placeholder="Ex. Arroz" #input formControlName="produto" id="produto">
        </mat-form-field>
    </form>
        <div class="table">

            <table mat-table [dataSource]="relatorioDataSource" class="mat-elevation-z8" >
                <ng-container matColumnDef="nome">
                    <th mat-header-cell *matHeaderCellDef>Nome Produto</th>
                    <td mat-cell *matCellDef="let venda"> {{venda.produto.nome}}</td>
                </ng-container>
                <ng-container matColumnDef="qtdVendida">
                    <th mat-header-cell *matHeaderCellDef="">Quantidade Vendido</th>
                    <td mat-cell *matCellDef="let venda"> {{venda.qtdProdutoVendido}}</td>
                </ng-container>
                <ng-container matColumnDef="vlrProduto">
                    <th mat-header-cell *matHeaderCellDef="">Valor do Produto</th>
                    <td mat-cell *matCellDef="let venda"> R$ {{venda.produto.vlrProduto}}</td>
                </ng-container>
                <ng-container matColumnDef="vlrTotal">
                    <th mat-header-cell *matHeaderCellDef="">Valor do Total da Venda</th>
                    <td mat-cell *matCellDef="let venda"> R$ {{venda.vlrTotal}}</td>
                </ng-container>
                <ng-container matColumnDef="dthVenda">
                    <th mat-header-cell *matHeaderCellDef="">Ultima Alteração</th>
                    <td mat-cell *matCellDef="let venda"> {{_pipe.transform(venda.dthVenda,'dd/MM/yyyy')}}</td>
                </ng-container>
                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row;columns:displayedColumns"></tr>
                <div class="mat-row" *matNoDataRow>
                    <p class="mat-cell" colspan="4" style="display:flex; justify-items: center;">Não foi encontrado nenhum produto</p>
                </div>
            </table>
            <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users"></mat-paginator>        
        </div>
        </div>
